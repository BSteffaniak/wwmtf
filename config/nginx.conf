pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {}

http {
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $host_allowed {
    default 0;
    'wwmtf.hyperchad.dev' 1;
    'wwmtf.fly.dev' 1;
}

map $request_method:$http_sec_fetch_site $fetch_site_allowed {
    default 0;
    ~^(GET|HEAD|OPTIONS): 1;
    'POST:same-origin' 1;
}

map $request_method:$uri $account_limit_key {
    default '';
    'POST:/account/migrate' $binary_remote_addr;
    'GET:/auth/google/start' $binary_remote_addr;
    'GET:/auth/google/callback' $binary_remote_addr;
}

limit_req_zone $account_limit_key zone=account_endpoints:10m rate=1r/s;

log_format secret_safe '$remote_addr $request_method $uri $status $upstream_status $body_bytes_sent $request_time $upstream_response_time $request_id $upstream_http_x_hyperchad_transport_diagnostic';

server {
    listen 8080 default_server;
    server_name wwmtf.hyperchad.dev wwmtf.fly.dev;
    server_tokens off;

    access_log /dev/stdout secret_safe;
    error_log /dev/stderr warn;

    client_max_body_size 3m;

    if ($host_allowed = 0) {
        return 421;
    }

    if ($fetch_site_allowed = 0) {
        return 403;
    }

    add_header Cache-Control 'private, no-store' always;
    add_header X-Request-ID $request_id always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com" always;
    add_header Permissions-Policy 'camera=(), geolocation=(), microphone=()' always;
    add_header Referrer-Policy 'no-referrer' always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options 'nosniff' always;
    add_header X-Frame-Options 'DENY' always;

    location / {
        limit_except GET HEAD POST OPTIONS {
            deny all;
        }
        limit_req zone=account_endpoints burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8343;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_pass_header X-HyperChad-Transport-Diagnostic;
    }
}
}
