name: Deploy Infrastructure

"on":
  workflow_dispatch:

permissions:
  contents: read

environment: production

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TOFU_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TOFU_STATE_SECRET_ACCESS_KEY }}
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_ENCRYPTION_PASSPHRASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.9
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Discover production inputs
        run: ./scripts/prepare-production-infra.sh
      - name: Assert remote state exists
        run: |
          aws s3api list-objects-v2 \
            --bucket "$TOFU_STATE_BUCKET" \
            --prefix words-with-spouses/production.tfstate \
            --max-keys 2 \
            --endpoint-url "$TOFU_STATE_S3_ENDPOINT" \
            --region auto \
            --output json \
            | jq -e 'any(.Contents[]?; .Key == "words-with-spouses/production.tfstate")'
      - name: Initialize
        run: tofu init -backend-config=backend.hcl
        working-directory: infra/deploy
      - name: Check formatting
        run: tofu fmt -check -recursive .
        working-directory: infra/deploy
      - name: Archive current encrypted state
        run: ./scripts/archive-opentofu-state.sh archive
      - name: Plan
        run: tofu plan -out=tfplan
        working-directory: infra/deploy
      - name: Apply reviewed plan
        run: tofu apply -auto-approve tfplan
        working-directory: infra/deploy
