name: Backup Production Database

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

environment: production

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Install age
        run: sudo apt-get update && sudo apt-get install --yes age
      - name: Assert encrypted backup configuration
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DESTINATION: ${{ secrets.BACKUP_DESTINATION }}
        run: test -n "$BACKUP_AGE_RECIPIENT" && [[ "$BACKUP_DESTINATION" == s3://* ]]
      - name: Export encrypted stopped database backup
        run: ./scripts/backup-production.sh
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DESTINATION: ${{ secrets.BACKUP_DESTINATION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_DEFAULT_REGION: auto
