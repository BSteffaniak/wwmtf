[package]
authors = { workspace = true }
categories = ["games", "web-programming"]
description = "Renderer-neutral Words with Spouses application runtime"
edition = { workspace = true }
keywords = ["asynchronous", "game", "hyperchad", "word"]
license = { workspace = true }
name = "words_with_spouses_app"
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[[bin]]
name = "words-with-spouses"
path = "src/main.rs"
required-features = ["actix"]

[dependencies]
argon2 = { workspace = true }
async-trait = { workspace = true }
env_logger = { workspace = true }
futures-lite = { workspace = true }
hyperchad = { workspace = true, features = [
    "actions",
    "app",
    "renderer",
    "renderer-assets",
    "renderer-serde",
    "renderer-html",
    "renderer-vanilla-js",
    "renderer-vanilla-js-plugin-actions",
    "renderer-vanilla-js-plugin-form",
    "renderer-vanilla-js-plugin-idiomorph",
    "renderer-vanilla-js-plugin-nav",
    "renderer-vanilla-js-plugin-routing",
    "renderer-vanilla-js-plugin-shared-state",
    "router",
    "router-form",
    "router-serde",
    "serde",
    "shared-state-models",
    "shared-state-transport",
    "template",
    "transformer",
    "transformer-models",
] }
flume = { workspace = true }
log = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
switchy_database = { workspace = true, features = ["schema"] }
switchy_database_connection = { workspace = true, features = ["turso"] }
switchy_schema = { workspace = true, features = ["code"] }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
words_with_spouses_game_domain = { workspace = true }

[dev-dependencies]
futures-lite = { workspace = true }

[features]
default = ["actix"]
actix = [
    "hyperchad/renderer-html-actix",
    "hyperchad/renderer-html-sse",
    "hyperchad/shared-state-models",
    "hyperchad/shared-state-transport",
]
fail-on-warnings = ["hyperchad/fail-on-warnings"]
