[package]
authors     = { workspace = true }
categories  = ["games", "web-programming"]
description = "Renderer-neutral Words with More Than Friends application runtime"
edition     = { workspace = true }
keywords    = ["asynchronous", "game", "hyperchad", "word"]
license     = { workspace = true }
name        = "wwmtf_app"
readme      = { workspace = true }
repository  = { workspace = true }
version     = { workspace = true }

[[bin]]
name              = "wwmtf"
path              = "src/main.rs"
required-features = ["actix"]

[dependencies]
argon2 = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
env_logger = { workspace = true }
flume = { workspace = true }
futures-lite = { workspace = true }
hyperchad = { workspace = true, features = [
    "actions",
    "app",
    "renderer",
    "renderer-assets",
    "renderer-serde",
    "renderer-html",
    "renderer-vanilla-js",
    "renderer-vanilla-js-plugin-actions",
    "renderer-vanilla-js-plugin-form",
    "renderer-vanilla-js-plugin-idiomorph",
    "renderer-vanilla-js-plugin-nav",
    "renderer-vanilla-js-plugin-routing",
    "renderer-vanilla-js-plugin-shared-state",
    "router",
    "router-form",
    "router-serde",
    "serde",
    "shared-state-models",
    "shared-state-transport",
    "template",
    "transformer",
    "transformer-models",
] }
image = { workspace = true }
log = { workspace = true }
openidconnect = { workspace = true }
rand_core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
switchy_database = { workspace = true, features = ["schema"] }
switchy_database_connection = { workspace = true, features = ["turso"] }
switchy_schema = { workspace = true, features = ["code"] }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
wwmtf_game_domain = { workspace = true }

[dev-dependencies]
futures-lite = { workspace = true }

[features]
actix = [
    "hyperchad/renderer-html-actix",
    "hyperchad/shared-state-models",
    "hyperchad/shared-state-transport",
]
default = ["actix"]
fail-on-warnings = ["hyperchad/fail-on-warnings"]
insecure = ["hyperchad/renderer-vanilla-js-plugin-uuid-insecure"]
metrics = []
